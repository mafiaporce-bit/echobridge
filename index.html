<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EchoBridge</title>
<meta name="description" content="EchoBridge: a calm communication and language app for kids.">
<meta name="theme-color" content="#EDF7FD">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EDF7FD; --paper:#FFFFFF; --meadow:#EEF9F1;
  --hill1:#DDF3E5; --hill2:#CDEDD9; --hill3:#E4F2FB;
  --ink:#1F3A4B; --ink2:#5A7384;
  --card:#FFFFFF; --soft:#F1F8FC; --rim:#FFFFFF;
  --blue:#3B97D3; --blueSoft:#CFE9F7;
  --green:#34A870; --greenSoft:#D3F2DF;
  --sun:#FFC94D; --shadow:rgba(40,90,120,.14);
  --font:"Baloo 2","Nunito","Trebuchet MS","Segoe UI Rounded",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#16303D; --paper:#18343F; --meadow:#173A30; --hill1:#1C4535; --hill2:#1F4D3B; --hill3:#1B3C4B;
    --ink:#E8F5F9; --ink2:#A7C4D0; --card:#1F4251; --soft:#1A3A47; --rim:#E6F3F7;
    --blueSoft:#24536A; --greenSoft:#1F5842; --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --sky:#16303D; --paper:#18343F; --meadow:#173A30; --hill1:#1C4535; --hill2:#1F4D3B; --hill3:#1B3C4B;
  --ink:#E8F5F9; --ink2:#A7C4D0; --card:#1F4251; --soft:#1A3A47; --rim:#E6F3F7;
  --blueSoft:#24536A; --greenSoft:#1F5842; --shadow:rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
body{font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:14px}

/* ---------- views + living background ---------- */
.view{position:fixed;inset:0;z-index:10;background:linear-gradient(180deg,var(--sky) 0%,var(--paper) 48%,var(--meadow) 100%);overflow:hidden}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh}
.bg .critter{position:absolute;left:0;will-change:transform}
.bg .critter svg{display:block;width:auto}
.bg .cloud svg{height:clamp(60px,10vh,96px)}.bg .bird svg{height:clamp(40px,6vh,56px)}.bg .fly svg{height:clamp(40px,6vh,54px)}
.bg .turtle svg{height:clamp(62px,9vh,86px)}.bg .bunny svg{height:clamp(72px,11vh,100px)}.bg .duck svg{height:clamp(58px,8.5vh,80px)}
.view.quiet .bg .critter{opacity:.5}
.bg .cloud{top:7vh;animation:drift 150s linear infinite}
.bg .cloud.c2{top:20vh;animation-duration:190s;animation-delay:-90s;opacity:.8}
.bg .bird{top:12vh;animation:fly 48s linear infinite;animation-delay:-12s}
.bg .bird .wing{transform-origin:20px 15px;animation:flap .45s ease-in-out infinite alternate}
.bg .fly{top:34vh;animation:fly 70s linear infinite;animation-delay:-40s}
.bg .fly .float{animation:bob 4s ease-in-out infinite alternate}
.bg .fly .wings{transform-origin:20px 17px;animation:flutter .3s ease-in-out infinite alternate}
.bg .turtle{bottom:4.5vh;animation:walk 110s linear infinite;animation-delay:-30s}
.bg .turtle .step{animation:bob 1.1s ease-in-out infinite alternate}
.bg .bunny{bottom:8vh;animation:walk 60s linear infinite;animation-delay:-5s}
.bg .bunny .hop{animation:hop 2.6s ease-in-out infinite}
.bg .duck{bottom:13vh;animation:walkBack 90s linear infinite;animation-delay:-60s}
.bg .duck .step{animation:waddle 1.4s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(calc(100vw + 220px))}}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(calc(100vw + 80px))}}
@keyframes walk{from{transform:translateX(-120px)}to{transform:translateX(calc(100vw + 120px))}}
@keyframes walkBack{from{transform:translateX(calc(100vw + 120px)) scaleX(-1)}to{transform:translateX(-120px) scaleX(-1)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
@keyframes flutter{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes hop{0%,55%,100%{transform:translateY(0)}72%{transform:translateY(-26px)}}
@keyframes waddle{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.view > :not(.bg){position:relative;z-index:2}
.view > .body,.view > .hiveScroll,.view > .strip,.view > .topbar{position:absolute}

/* corner button (gear / back) */
.corner{position:fixed!important;left:0;top:0;z-index:30!important;width:118px;height:calc(118px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);border-bottom-right-radius:118px;background:rgba(52,110,140,.55);display:block}
.corner::after{content:"";position:absolute;left:-4px;top:-4px;width:130px;height:calc(130px + env(safe-area-inset-top,0px));
  border-bottom-right-radius:130px;border:3px dashed rgba(255,255,255,.95);border-left:0;border-top:0;pointer-events:none}
.corner svg{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));width:66px;height:66px;transition:transform .5s}
.corner:active svg{transform:scale(.9) rotate(-20deg)}
.calmFab{position:fixed!important;right:calc(18px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:30!important;
  width:76px;height:76px;border-radius:50%;background:var(--card);box-shadow:0 6px 16px var(--shadow);display:grid;place-items:center}
.calmFab svg{width:56px;height:56px}
.buddy span{font-size:34px;line-height:1}
.voiceNote{position:fixed!important;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40!important;max-width:calc(100% - 32px);
  background:#FFF6D8;color:#4A3B12;border-radius:99px;padding:8px 10px 8px 18px;box-shadow:0 8px 24px var(--shadow);display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.2;font-weight:700;animation:fade .3s}
.voiceNote button{flex:none;padding:8px 14px 6px;border-radius:99px;background:#fff;font-weight:700;min-width:44px}

/* ---------- home hive ---------- */
.hiveScroll{inset:0;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hiveScroll::-webkit-scrollbar{display:none}
.hive{position:relative;flex:none;margin-left:clamp(60px,9vw,120px)}
.tile,.lv{position:absolute;padding:0;filter:drop-shadow(0 8px 12px var(--shadow));transition:transform .18s ease}
.tile:active,.lv:active{transform:scale(.95)}
.tile .rim,.tile .art,.lv .rim,.lv .art{position:absolute;clip-path:var(--hex)}
.tile .rim,.lv .rim{inset:0;background:var(--rim)}
.tile .art{inset:4.6%;overflow:hidden;background:#9fd6f2}
.tile .art svg,.tile .art img{width:100%;height:100%;display:block;object-fit:cover}
.tile .tlabel{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);white-space:nowrap;
  background:rgba(255,255,255,.95);color:#1F3A4B;font-weight:700;font-size:clamp(14px,2.1vh,20px);line-height:1;padding:.42em .8em .32em;border-radius:99px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tile:focus-visible,.lv:focus-visible{outline:none}
.tile:focus-visible .rim,.lv:focus-visible .rim{background:var(--sun)}
.brand{position:absolute!important;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-weight:800;font-size:22px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}

/* ---------- level map ---------- */
.lvBody{display:flex;align-items:flex-start;justify-content:center;padding-top:6px!important}
.lvHive{position:relative;flex:none;margin:0 auto}
.lv .art{inset:5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#1F3A4B}
.lv .lvE{font-size:var(--lvE,40px);line-height:1.05}
.lv .lvN{font-weight:800;font-size:var(--lvN,26px);line-height:1}
.lv .lvS{font-size:var(--lvS,16px);letter-spacing:2px;color:#E5A00D;line-height:1.1}
.lv .lvT{font-size:12px;font-weight:700;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;color:#35566A}
.lv.next .rim{background:var(--sun)}

/* ---------- iris transition ---------- */
.iris{position:fixed;inset:0;z-index:5;overflow:hidden;pointer-events:none}
.ringWrap{position:absolute;left:0;top:0;width:0;height:0}
.ring{position:absolute;border-radius:50%}

/* ---------- shared screen chrome ---------- */
.top{height:110px;display:flex;align-items:center;justify-content:center;padding:0 130px}
.title{font-size:clamp(26px,4.2vh,40px);font-weight:800;margin:0;line-height:1;text-align:center;padding:.22em .8em .12em;border-radius:99px;background:var(--card);box-shadow:0 4px 14px var(--shadow)}
.body{left:0;right:0;top:110px;bottom:0;overflow:auto;padding:0 max(22px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
.bigBtn{display:inline-flex;align-items:center;gap:12px;padding:14px 30px 12px;border-radius:99px;background:var(--green);color:#fff;font-weight:800;font-size:26px;box-shadow:0 5px 0 #217a50}
.bigBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #217a50}
.bigBtn.alt{background:var(--blue);box-shadow:0 5px 0 #23709f}
.bigBtn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.1)}
.speakBtn{width:58px;height:58px;border-radius:50%;background:var(--card);display:inline-grid;place-items:center;box-shadow:0 4px 10px var(--shadow);flex:none}
.speakBtn svg{width:32px;height:32px}
.speakBtn.talking{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.1)}}

/* ---------- What I mean ---------- */
.mean{display:grid;grid-template-columns:140px 1fr;gap:20px;height:100%;padding-bottom:128px}
.rail{display:flex;flex-direction:column;gap:9px;overflow:auto;padding:4px 4px 10px}
.cat{display:flex;flex-direction:column;align-items:center;border-radius:24px;padding:6px 6px 4px;background:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.06);font-weight:700;font-size:17px;line-height:1.1;border:4px solid transparent;flex:none}
.cat .e{font-size:34px;line-height:1.1}
.cat[aria-pressed="true"]{border-color:var(--green);background:var(--greenSoft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;align-content:start;overflow:auto;padding:4px 6px 16px}
.need{position:relative;border-radius:30px;background:var(--card);padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:200px;box-shadow:0 6px 0 rgba(0,0,0,.06);transition:transform .15s}
.need:active{transform:scale(.95)}
.need .pic{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-size:66px;line-height:1;overflow:hidden}
.need .pic img{width:100%;height:100%;object-fit:cover}
.need .words{font-weight:700;font-size:21px;line-height:1.15;text-align:center}
.need.script{background:#FFFBEA}
.need .quote{font-size:17px;color:var(--ink2);text-align:center;line-height:1.1}
.need .mic{position:absolute;right:14px;top:12px;width:26px;height:26px;opacity:.7}
.strip{left:max(22px,env(safe-area-inset-left,0px));right:max(22px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:108px;border-radius:32px;background:var(--card);
  display:flex;align-items:center;gap:18px;padding:0 22px;box-shadow:0 8px 20px var(--shadow)}
.strip .sp{width:80px;height:80px;border-radius:50%;background:var(--greenSoft);display:grid;place-items:center;font-size:50px;overflow:hidden;flex:none}
.strip .sp img{width:100%;height:100%;object-fit:cover}
.strip .st{font-size:clamp(24px,3.8vh,38px);font-weight:800;line-height:1.1;flex:1}
.strip .st small{display:block;font-size:.55em;font-weight:600;color:var(--ink2)}
.strip.hint .st{color:var(--ink2);font-weight:600}
.strip.flash{animation:flash .5s ease}
@keyframes flash{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:none}}

/* ---------- quiz (scenes, feelings, yes/no, questions, I or you) ---------- */
.sc{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.scene{position:relative;border-radius:36px;overflow:hidden;aspect-ratio:4/3;background:var(--blueSoft);display:grid;place-items:center;border:6px solid var(--rim);box-shadow:0 8px 20px var(--shadow)}
.scene img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene .emo{display:flex;gap:10px;font-size:clamp(70px,13vh,130px);line-height:1;z-index:2}
.scene .emo span{display:inline-block;animation:popIn .6s cubic-bezier(.3,1.5,.5,1) both}
.scene .emo span:nth-child(2){animation-delay:.18s}.scene .emo span:nth-child(3){animation-delay:.36s}
.scene .say{position:absolute;left:8%;right:8%;top:8%;z-index:3;background:#fff;color:#1F3A4B;border-radius:24px;padding:10px 16px 8px;font-size:clamp(20px,3vh,28px);font-weight:800;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.scene .say::after{content:"";position:absolute;left:24%;bottom:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.scene.hasSay .emo{margin-top:22%}
@keyframes popIn{from{transform:scale(0) translateY(20px)}to{transform:none}}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:rgba(255,255,255,.5)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.fx.loud i{position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;border:6px solid rgba(255,120,120,.7);border-radius:50%;transform:translate(-50%,-50%) scale(.4);opacity:0;animation:wave 1.4s ease-out 3}
.fx.loud i:nth-child(2){animation-delay:.45s}.fx.loud i:nth-child(3){animation-delay:.9s}
@keyframes wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
.fx.bubbles i{position:absolute;bottom:-40px;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:rgba(255,255,255,.25);animation:rise 3.2s ease-in 2}
.fx.bubbles i:nth-child(1){left:18%}.fx.bubbles i:nth-child(2){left:44%;animation-delay:.8s;width:24px;height:24px}.fx.bubbles i:nth-child(3){left:70%;animation-delay:1.5s}
@keyframes rise{to{transform:translateY(-120%) translateY(-360px)}}
.fx.heart i{position:absolute;right:12%;top:14%;font-style:normal;font-size:54px;animation:beat 1s ease-in-out 4}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}}
.fx.sparkle i{position:absolute;font-style:normal;font-size:34px;animation:twinkle 1.4s ease-in-out 3;opacity:0}
.fx.sparkle i:nth-child(1){left:12%;top:16%}.fx.sparkle i:nth-child(2){right:14%;top:22%;animation-delay:.4s}.fx.sparkle i:nth-child(3){left:22%;bottom:18%;animation-delay:.8s}
@keyframes twinkle{50%{opacity:1;transform:scale(1.2)}}
.sceneText{margin:14px 6px 0;font-size:clamp(22px,3.4vh,32px);font-weight:700;line-height:1.2;display:flex;gap:12px;align-items:center}
.q{display:flex;gap:14px;align-items:center;font-size:clamp(24px,3.6vh,34px);font-weight:800;line-height:1.15;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:14px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1;flex-direction:column;justify-content:center;min-height:200px;text-align:center;padding:16px}
.opts.two .opt .oe{width:110px;height:110px;font-size:68px}
.opts.two .opt .speakBtn{position:absolute;right:12px;top:12px}
.opts.faces .opt .oe{width:96px;height:96px;font-size:70px}
.opt{position:relative;display:flex;align-items:center;gap:16px;text-align:left;border-radius:30px;background:var(--card);padding:12px 18px 12px 12px;min-height:104px;box-shadow:0 6px 0 rgba(0,0,0,.06);border:5px solid transparent;transition:opacity .4s,transform .2s,border-color .3s;cursor:pointer}
.opt .oe{width:80px;height:80px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:48px;flex:none}
.opt .ot{font-size:clamp(21px,3vh,28px);font-weight:700;line-height:1.15;flex:1}
.opt .speakBtn{width:50px;height:50px;box-shadow:none;background:var(--soft)}
.opt.right{border-color:var(--green);background:var(--greenSoft);animation:yay .6s ease}
.opt.gone{opacity:.38;transform:scale(.97)}
.nudge{animation:nudge .5s ease!important}
@keyframes yay{40%{transform:scale(1.04)}}
@keyframes nudge{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
.why{margin-top:16px;border-radius:28px;padding:16px 20px;background:var(--card);display:flex;gap:14px;align-items:center;font-size:clamp(20px,2.9vh,26px);font-weight:700;line-height:1.2;box-shadow:0 6px 16px var(--shadow)}
.why.good{background:var(--greenSoft)}
.why .big{font-size:46px;line-height:1}
.progress{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.progress i{width:22px;height:22px;border-radius:50%;background:var(--soft);border:3px solid var(--blueSoft)}
.progress i.on{background:var(--sun);border-color:#F2B632}
.done{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:3vh}
.done .stars{font-size:80px;letter-spacing:10px;line-height:1}
.done .stars .off{filter:grayscale(1);opacity:.35}
.done h2{font-size:clamp(34px,6vh,56px);margin:0;line-height:1}
.done .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

/* ---------- matcher ---------- */
.board{position:relative;max-width:1060px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px 120px;align-items:stretch}
.board svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.colHead{font-size:22px;font-weight:700;color:var(--ink2);text-align:center;margin:0}
.chip{position:relative;display:flex;align-items:center;gap:14px;min-height:100px;padding:12px 20px;border-radius:30px;background:var(--card);box-shadow:0 6px 0 rgba(0,0,0,.06);border:5px solid transparent;text-align:left;transition:border-color .25s,background .25s}
.chip.phrase{border-radius:34px 34px 34px 8px;background:#FFFBEA;color:#1F3A4B}
.chip .ce{font-size:48px;line-height:1;flex:none}
.chip .ce img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.chip .ct{font-size:clamp(20px,2.9vh,27px);font-weight:700;line-height:1.15}
.chip.sel{border-color:var(--blue)}
.chip.matched{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 20%,var(--card))}
.chip .badge{position:absolute;right:-10px;top:-10px;width:38px;height:38px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}
.empty{max-width:640px;margin:6vh auto 0;text-align:center;font-size:26px;font-weight:600;line-height:1.3}
.empty .e{font-size:90px}

/* ---------- first, then ---------- */
.slots{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;max-width:1100px;margin:0 auto 22px}
.slot{width:clamp(150px,20vw,220px);aspect-ratio:1/1.05;border-radius:30px;border:5px dashed var(--blueSoft);background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center}
.slot .sl{font-size:22px;font-weight:800;color:var(--ink2)}
.slot.filled{border-style:solid;border-color:var(--green);background:var(--greenSoft);animation:yay .5s}
.slot .se{font-size:64px;line-height:1}
.slot .stx{font-size:19px;font-weight:700;line-height:1.1}
.pile{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.card{width:clamp(150px,20vw,210px);min-height:170px;border-radius:30px;background:var(--card);box-shadow:0 6px 0 rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center}
.card .ce{font-size:64px;line-height:1}
.card .ct{font-size:20px;font-weight:700;line-height:1.1}
.card.used{visibility:hidden}

/* ---------- listen & tap ---------- */
.listenQ{display:flex;justify-content:center;align-items:center;gap:16px;margin:0 auto 22px;max-width:900px;font-size:clamp(26px,4vh,38px);font-weight:800;line-height:1.15;text-align:center}
.things{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,170px));gap:18px;justify-content:center}
.thing{position:relative;aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:0 6px 0 rgba(0,0,0,.06);font-size:clamp(56px,9vh,86px);display:grid;place-items:center;line-height:1;border:5px solid transparent}
.thing.ok{border-color:var(--green);background:var(--greenSoft)}
.thing .num{position:absolute;right:-4px;top:-4px;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-size:22px;font-weight:800;display:grid;place-items:center}

/* ---------- calm ---------- */
.calm .body{top:0;display:grid;place-items:center;overflow:hidden}
.breath{position:relative;width:min(76vmin,620px);aspect-ratio:1;display:grid;place-items:center}
.breath .r{position:absolute;border-radius:50%;transition:transform 4s ease-in-out}
.orb{position:relative;width:48%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFFFFF 0%,var(--o1,#D9F7EA) 35%,var(--o2,#8FDDC0) 100%);
  box-shadow:0 0 40px 10px rgba(255,255,255,.7),0 0 90px 30px color-mix(in srgb,var(--o2,#8FDDC0) 45%,transparent);transform:scale(.6);transition:transform 4s ease-in-out;display:grid;place-items:center}
.orb .inner{display:flex;flex-direction:column;align-items:center;transform:scale(1.6);transition:transform 4s ease-in-out}
.orb .oe{font-size:clamp(40px,8vmin,72px);line-height:1}
.orb .ow{font-size:clamp(20px,3.6vmin,32px);font-weight:800;color:#1F4B42;text-align:center;line-height:1.1;max-width:9em}
.calmName{position:absolute!important;top:calc(28px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-weight:800;font-size:28px;pointer-events:none}
.calmBar{position:absolute!important;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 16px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 22px 10px;border-radius:99px;background:var(--card);font-weight:700;font-size:21px;box-shadow:0 4px 12px var(--shadow)}
.pill[aria-pressed="false"]{opacity:.55}
.dots{position:absolute!important;top:calc(72px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--soft);border:2px solid var(--blueSoft)}
.dots i.on{background:#8FDDC0;border-color:#8FDDC0;box-shadow:0 0 10px #8FDDC0}

/* ---------- sheets / grown-up corner ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(20,40,52,.4);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(720px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--card);border-radius:30px;padding:24px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25);user-select:text;-webkit-user-select:text}
.sheet h2{margin:0 0 12px;font-size:30px;line-height:1.1}
.pin{width:min(420px,100%);text-align:center}
.pinDots{display:flex;justify-content:center;gap:16px;margin:10px 0 20px}
.pinDots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink2)}
.pinDots i.on{background:var(--ink2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keys button{height:74px;border-radius:22px;background:var(--soft);font-size:32px;font-weight:700}
.muted{color:var(--ink2);font-size:17px;line-height:1.35}
.parent .body{display:grid;grid-template-columns:230px 1fr;gap:22px;padding-top:4px}
.tabs{display:flex;flex-direction:column;gap:8px}
.tabs button{text-align:left;padding:12px 16px 10px;border-radius:18px;font-weight:700;font-size:19px;line-height:1.15;background:rgba(255,255,255,.6)}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 4px 12px var(--shadow)}
.panel{background:var(--card);border-radius:28px;padding:22px 24px;min-height:0;overflow:auto;user-select:text;-webkit-user-select:text;align-self:start;max-height:100%;box-shadow:0 6px 18px var(--shadow)}
.panel h2{margin:0 0 4px;font-size:28px;line-height:1.1}
.panel h3{margin:18px 0 8px;font-size:21px}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field > span{font-weight:700;font-size:17px}
.field input[type=text],.field input[type=password],.field input:not([type]),.field select,.field textarea,.vc select{border:2px solid var(--blueSoft);background:var(--soft);border-radius:14px;padding:10px 14px;font-size:18px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 18px 7px;border-radius:99px;background:var(--soft);font-weight:700;font-size:17px;border:2px solid var(--blueSoft)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{color:#B4404C;border-color:#F3C2C8}
.btn.rec{background:#FCE3E6;border-color:#F3C2C8;color:#9E2F3C}
.btn[disabled]{opacity:.45}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--soft)}
.item .th{width:56px;height:56px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:32px;overflow:hidden;flex:none}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0;line-height:1.25}
.item .tx b{display:block;font-size:18px}
.item .tx small{color:var(--ink2);font-size:15px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:6px 14px 4px;border-radius:99px;background:var(--soft);border:2px solid var(--blueSoft);font-weight:700;font-size:16px}
.chips button[aria-pressed="true"]{background:var(--greenSoft);border-color:var(--green)}
.emojiRow{display:flex;flex-wrap:wrap;gap:4px}
.emojiRow button{width:44px;height:44px;border-radius:12px;font-size:26px;background:var(--soft)}
.emojiRow button[aria-pressed="true"]{background:var(--greenSoft);outline:3px solid var(--green)}
.media{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.media .prev{width:90px;height:90px;border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--ink2);font-size:14px;text-align:center}
.media .prev img{width:100%;height:100%;object-fit:cover}
.stepBox{border:2px dashed var(--blueSoft);border-radius:20px;padding:6px 16px 12px;margin:12px 0}
.optGrid{display:grid;grid-template-columns:1fr;gap:10px}
.optEd{display:grid;grid-template-columns:auto 70px 1fr;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:8px}
.optEd input{border:2px solid var(--blueSoft);border-radius:10px;padding:6px 10px;font-size:17px;width:100%;background:var(--card)}
.optEd .whyIn{grid-column:2 / 4}
.toggle{display:flex;gap:10px;align-items:center;font-weight:600;font-size:17px;margin:6px 0}
.toggle input{width:24px;height:24px;accent-color:var(--green)}
.note{font-size:15px;color:var(--ink2);border-left:4px solid var(--blueSoft);padding-left:10px;margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--card);padding:10px 20px 8px;border-radius:99px;font-weight:700;font-size:17px;animation:fade .2s}
.sheetBar{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;position:sticky;bottom:-24px;background:var(--card);padding:12px 0 4px}
.vcGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
.vc{border-radius:24px;background:var(--soft);padding:14px 16px;border:4px solid transparent}
.vc.on{border-color:var(--green);background:var(--greenSoft)}
.vc .vh{display:flex;align-items:center;gap:10px}
.vc .vh .ve{font-size:44px;line-height:1}
.vc .vh input{flex:1;min-width:0;border:2px solid var(--blueSoft);border-radius:12px;padding:4px 10px;font-size:20px;font-weight:800;background:var(--card)}
.vc label.sl{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-weight:700;font-size:15px}
.vc label.sl span{display:flex;justify-content:space-between}
.vc input[type=range]{width:100%;accent-color:var(--green)}
.vc select{font-size:15px;padding:6px 10px;margin-top:8px}
.status{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;font-weight:700;font-size:16px;background:var(--soft)}
.status.ok{background:var(--greenSoft)}
.status.bad{background:#FFF1D6;color:#5A4410}
.progTable{width:100%;border-collapse:collapse;font-size:16px}
.progTable td{padding:6px 4px;border-bottom:1px solid var(--blueSoft)}
.progTable td:last-child{text-align:right;font-weight:700}

/* ---------- home layout: top bar, tools, no overlaps ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:center;padding:0 150px;pointer-events:none}
.topbar > *{pointer-events:auto}
.hello{font-weight:800;font-size:clamp(20px,3.4vh,32px);line-height:1;padding:.36em 1em .26em;border-radius:99px;background:var(--card);box-shadow:0 4px 14px var(--shadow);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.home .hiveScroll{top:96px;bottom:54px}
.homeTools{position:fixed!important;right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:30!important;display:flex;align-items:center;gap:10px}
.buddy{display:flex;align-items:center;gap:8px;padding:8px 16px 6px 10px;border-radius:99px;background:var(--card);box-shadow:0 6px 16px var(--shadow);font-weight:700;font-size:19px;min-height:62px}
.musicBtn{width:62px;height:62px;border-radius:50%;background:var(--card);box-shadow:0 6px 16px var(--shadow);font-size:30px;display:grid;place-items:center;transition:opacity .2s}
.musicBtn[aria-pressed="false"]{opacity:.45;filter:grayscale(1)}
.title .tbadge{display:inline-block;margin-left:.5em;padding:.1em .55em 0;border-radius:99px;background:var(--sun);color:#4A3B12;font-size:.6em;vertical-align:middle}
.tips{margin:0 0 6px;padding-left:22px;font-size:17px;line-height:1.4}
.tips li{margin:6px 0}
.lv .lvT{font-size:var(--lvT,12px)}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst i{position:absolute;left:var(--x);top:62%;font-style:normal;font-size:var(--s);opacity:0;animation:floatUp var(--d) ease-out var(--dl) both}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(-75vh) rotate(25deg) scale(1.1)}}
.calmName{padding:0 130px}
.loadPill{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--card);color:var(--ink);border-radius:99px;padding:8px 18px 6px;font-weight:700;font-size:17px;box-shadow:0 8px 24px var(--shadow);white-space:nowrap;animation:fade .3s}

@media (max-width:820px){
  .mean{grid-template-columns:104px 1fr}
  .cat{font-size:14px}.cat .e{font-size:30px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .need .pic{width:90px;height:90px;font-size:52px}
  .sc{grid-template-columns:1fr}
  .board{gap:14px 48px}
  .parent .body{grid-template-columns:1fr}
  .tabs{flex-direction:row;overflow-x:auto}
  .tabs button{white-space:nowrap}
  .top{padding:0 96px}
  .buddy b{display:none}
  .topbar{padding:0 120px}
  .calmName{padding:0 110px;font-size:22px}
}

  // Every buddy has one voice file: <pack>.ebv = 'EBV2' + index length + index JSON + MP3 clips back to back.
  // The index and the audio live in the same file, and every clip carries a checksum, so a damaged or altered file is refused instead of saying the wrong words.
  bases:['','voices/v1/'], packs:{}, decoded:new Map(), playing:[], onProgress:null,
  fnv(s){ let h=0x811c9dc5; for(const b of new TextEncoder().encode(s)){ h^=b; h=Math.imul(h,0x01000193)>>>0 } return h.toString(16).padStart(8,'0') },
  crcTable:null,
  crc32(u8){ let T=this.crcTable; if(!T){ T=this.crcTable=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; T[n]=c>>>0 } }
    let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=T[(c^u8[i])&0xFF]^(c>>>8); return ((c^0xFFFFFFFF)>>>0).toString(16).padStart(8,'0') },
  norm(t){ return String(t==null?'':t).replace(/\s+/g,' ').trim() },
  enabled(){ return cfg.kokoro!==false },
  pack(id){ return this.packs[id] },
  status(id){ const p=this.packs[id]; return !p?'none':p.ok?'ready':p.failed?'failed':'loading' },
  problem(id){ const p=this.packs[id]; return p&&p.failed?p.error||'unavailable':'' },
  ready(id){
    if(!id) return Promise.resolve(false);
    const p=this.packs[id]||(this.packs[id]={ok:false,failed:false,progress:0});
    if(p.ok) return Promise.resolve(true); if(p.failed) return Promise.resolve(false);
    if(p.loading) return p.loading;
    p.loading=(async()=>{
      const ac=new AbortController(); let stall=null; const poke=(ms)=>{ clearTimeout(stall); stall=setTimeout(()=>ac.abort(),ms) };
      try{
        // the voice file may sit next to the app or in voices/v1/: use whichever answers
        let r=null; poke(15000);
        for(const bs of this.bases){ try{ const r0=await fetch(bs+id+'.ebv',{cache:'force-cache',signal:ac.signal}); if(r0.ok){ r=r0; break } }catch(e){ if(ac.signal.aborted) throw new Error('timeout') } }
        if(!r){ p.error='missing'; throw new Error('voice file not found: '+id+'.ebv') }
        const total=+r.headers.get('content-length')||0; let buf;
        if(r.body){ const reader=r.body.getReader(), chunks=[]; let got=0;
          for(;;){ poke(20000); const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length; if(total){ p.progress=got/total; if(this.onProgress) this.onProgress(id,Math.min(.99,p.progress)) } }
          const all=new Uint8Array(got); let o=0; for(const ch of chunks){ all.set(ch,o); o+=ch.length } buf=all }
        else buf=new Uint8Array(await r.arrayBuffer());
        clearTimeout(stall);
        // unpack + verify
        if(buf.length<8||String.fromCharCode(buf[0],buf[1],buf[2],buf[3])!=='EBV2'){ p.error='damaged'; throw new Error('not a voice file') }
        let index,data;
        try{ const ilen=new DataView(buf.buffer,buf.byteOffset,buf.byteLength).getUint32(4,true); index=JSON.parse(new TextDecoder().decode(buf.subarray(8,8+ilen))); data=buf.subarray(8+ilen) }
        catch(err){ p.error='damaged'; throw new Error('voice file index unreadable') }
        if(data.length!==index.size){ p.error='damaged'; throw new Error('voice file incomplete: '+data.length+' of '+index.size+' bytes') }
        if(index.crc&&this.crc32(data)!==index.crc){ p.error='damaged'; throw new Error('voice file checksum mismatch') }
        p.index=index.h||{}; p.data=data; p.ok=true; p.progress=1; if(this.onProgress) this.onProgress(id,1); return true
      }catch(e){ clearTimeout(stall); console.warn('voice pack unavailable',id,e); p.failed=true; p.error=p.error||(ac.signal.aborted?'timeout':'unavailable'); if(this.onProgress) this.onProgress(id,-1); return false }
      finally{ p.loading=null }
    })();
    return p.loading },
  has(id,key){ const p=this.packs[id]; return !!(p&&p.ok&&p.index[this.fnv(key)]) },
  async buffer(id,key){
    const ck=id+':'+key; if(this.decoded.has(ck)) return this.decoded.get(ck);
    const p=this.packs[id]; const e=p&&p.ok&&p.index[this.fnv(key)]; if(!e) return null;
    const ctx=SFX.raw(); if(!ctx) return null;
    const bytes=p.data.slice(e[0],e[0]+e[1]);
    if(e[2]&&this.crc32(bytes)!==e[2]){ console.warn('clip checksum mismatch',id,key); return null }   // never play the wrong words
    let ab=null;
    try{ ab=await new Promise((res,rej)=>{ const r=ctx.decodeAudioData(bytes.buffer,res,rej); if(r&&r.then) r.then(res,rej) }) }catch(err){ console.warn('clip decode failed',id,key,err); return null }
    if(this.decoded.size>300){ const first=this.decoded.keys().next().value; this.decoded.delete(first) }
    this.decoded.set(ck,ab); return ab },
  async mediaBuffer(dataUrl){
    const ck='m:'+dataUrl.slice(-40)+dataUrl.length; if(this.decoded.has(ck)) return this.decoded.get(ck);
    const ctx=SFX.raw(); if(!ctx) return null;
    const bytes=await (await fetch(dataUrl)).arrayBuffer();
    const ab=await new Promise((res,rej)=>{ const r=ctx.decodeAudioData(bytes,res,rej); if(r&&r.then) r.then(res,rej) });
    this.decoded.set(ck,ab); return ab },
  // Turn what the app wants to say into clip keys. Returns null when any piece is missing from the pack.
  resolve(id,text,opts={}){
    const parts=Array.isArray(text)?text:[text]; const segs=[];
    for(const part of parts){
      if(part&&typeof part==='object'){ if(part.audio) segs.push(part); continue }
      const key=this.norm(part); if(!key) continue;
      if(opts.slow&&this.has(id,key+'|slow')){ segs.push({key:key+'|slow'}); continue }
      if(this.has(id,key)){ segs.push({key}); continue }
      const sents=Voice.sentences(key); if(sents.length<2) return null;
      for(const s of sents){ if(!this.has(id,s)) return null; segs.push({key:s,pause:.22}) }

    return segs.length?segs:null },
  stop(){ for(const s of this.playing){ try{ s.stop() }catch(e){} } this.playing=[] },
  async play(id,segs,opts={}){
    const ctx=SFX.raw(); if(!ctx) return false;
    const bufs=[]; for(const s of segs){ const b=s.audio?await this.mediaBuffer(await Store.getMedia(s.audio)):await this.buffer(id,s.key); if(!b) return false; bufs.push([b,s.pause||.1]) }
    this.stop(); const rate=clamp(+(opts.rate||1),.8,1.2);
    return new Promise(res=>{
      let t=ctx.currentTime+.03, last=null; const mine=[];
      bufs.forEach(([b,pause],i)=>{ const src=ctx.createBufferSource(); src.buffer=b; src.playbackRate.value=rate; src.connect(ctx.destination); src.start(t); t+=b.duration/rate+(i<bufs.length-1?pause:0); mine.push(src); last=src });
      this.playing=mine; let done=false; const fin=()=>{ if(done) return; done=true; clearInterval(watch); if(this.playing===mine) this.playing=[]; res(true) };
      last.onended=fin;
      const total=(t-ctx.currentTime)*1000+150; setTimeout(fin,total);
      const watch=setInterval(()=>{ if(this.playing!==mine) fin() },120);   // a stop() from outside ends the promise early
    }) }
};

/* ================= Live Kokoro: speaks anything that is not in the recorded packs (custom buttons, stories, names) ================= */
// Same voices as the packs, generated on the tablet with kokoro-js. The model (~90 MB) downloads once, then is cached by the browser.
const Live={
  ids:{lily:'af_heart',mia:'bf_emma',rosie:'af_bella',leo:'am_puck',max:'am_michael'},
  tts:null, state:'idle', token:0, audio:null, onState:null,
  enabled(){ return cfg.live===true },
  set(s){ this.state=s; if(this.onState) this.onState(s) },
  start(){
    if(this.state==='ready') return Promise.resolve(true);
    if(this.state==='loading') return this.p;
    if(this.state==='failed') return Promise.resolve(false);
    this.set('loading');
    this.p=(async()=>{
      try{
        const {KokoroTTS}=await import('https://cdn.jsdelivr.net/npm/kokoro-js@1/+esm');
        this.tts=await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX',{dtype:'q8'});
        this.set('ready'); return true
      }catch(e){ console.warn('live Kokoro unavailable',e); this.set('failed'); return false }
    })();
    return this.p },
  stop(){ this.token++; if(this.audio){ try{ this.audio.pause() }catch(e){} this.audio=null } },
  // returns true when it spoke; false means "use the tablet voice instead"
  async speak(text,pack){
    const voice=this.ids[pack]; if(!voice) return false;
    if(this.state!=='ready'){ this.start(); return false }      // first time: start downloading, tablet voice covers this line
    const my=++this.token;
    try{
      const parts=Voice.sentences(text); const speed=clamp((cfg.speed||1)*.97,.8,1.2);
      let next=this.tts.generate(parts[0],{voice,speed});
      for(let i=0;i<parts.length;i++){
        const a=await next; if(my!==this.token) return true;
        if(i+1<parts.length) next=this.tts.generate(parts[i+1],{voice,speed});   // make the next sentence while this one plays
        const url=URL.createObjectURL(a.toBlob()); const el=new Audio(url); this.audio=el;
        await new Promise((res,rej)=>{ el.onended=res; el.onerror=rej; el.play().catch(rej) });
        URL.revokeObjectURL(url); if(my!==this.token) return true;
        if(i+1<parts.length) await new Promise(r=>setTimeout(r,160));
      }
      return true
    }catch(e){ console.warn('live Kokoro failed',e); return false }
  }
};

// Gentle pitch/speed values: anything far from 1.0 makes a speech engine sound robotic.
// pack = the Kokoro voice pack (natural recorded speech); pitch/rate only shape the tablet-voice fallback
const DEFAULT_VOICES=[
  {id:'lily',name:'Lily',kind:'girl',emoji:'🐰',pack:'lily',kokoro:'Heart',pitch:1.15,rate:.95,voiceURI:''},
  {id:'mia',name:'Mia',kind:'girl',emoji:'🦋',pack:'mia',kokoro:'Emma (British)',pitch:1.05,rate:.92,voiceURI:''},
  {id:'rosie',name:'Rosie',kind:'girl',emoji:'🌸',pack:'rosie',kokoro:'Bella',pitch:1.25,rate:.98,voiceURI:''},
  {id:'leo',name:'Leo',kind:'boy',emoji:'🦁',pack:'leo',kokoro:'Puck',pitch:.95,rate:.95,voiceURI:''},
  {id:'max',name:'Max',kind:'boy',emoji:'🐻',pack:'max',kokoro:'Michael',pitch:.85,rate:.9,voiceURI:''}
];
const PACKS={lily:'Heart (girl)',mia:'Emma (girl, British)',rosie:'Bella (girl)',leo:'Puck (boy)',max:'Michael (boy)'};
function otherBuddy(b){ const vs=cfg.voices.filter(v=>v.pack&&v.id!==b.id); return vs.find(v=>v.kind!==b.kind)||vs[0]||b }
const MALE_RX=/\bmale\b|\bman\b|boy|daniel|david|alex\b|fred|george|james|mark\b|rishi|aaron|arthur|guy|thomas|oliver|\btom\b|eddy|reed|rocko|-iol|-iom|-tpd|-gbd|-rjs|-aub|-ene\b|#male/i;
const FEMALE_RX=/female|woman|girl|samantha|karen|victoria|zira|susan|serena|moira|tessa|fiona|allison|\bava\b|\bzoe\b|nicky|kate|hazel|libby|sonia|aria|jenny|-sfg|-iob|-iog|-tpc|-tpf|-gba|-gbc|-gbg|-aua|#female|google us english|google uk english female/i;
const NOVELTY_RX=/espeak|compact|albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|junior|kathy|organ|princess|ralph|trinoids|whisper|zarvox|wobble|jester|superstar|grandma|grandpa|flo\b|sandy|shelley|rocko|eddy|reed/i;
const QUALITY_RX=/natural|neural|enhanced|premium|siri|online|wavenet|journey|studio|multilingual/i;
function voiceGender(v){ const s=(v.name+' '+v.voiceURI); if(/female/i.test(s)) return 'f'; if(MALE_RX.test(s)) return 'm'; if(FEMALE_RX.test(s)) return 'f'; return '?' }
function voiceQuality(x){ const s=x.name+' '+x.voiceURI; let q=0;
  if(NOVELTY_RX.test(s)) q-=12;
  if(/network/i.test(s)) q+=(navigator.onLine===false?-6:6);     // Android's high-quality voices need internet
  if(QUALITY_RX.test(s)) q+=5;
  if(/google/i.test(s)) q+=2;
  if(/microsoft/i.test(s)&&!/online|natural/i.test(s)) q-=1;      // the old desktop voices sound flat
  if(x.localService) q+=1;
  return q }
function activeBuddy(){ return (cfg.voices||DEFAULT_VOICES).find(v=>v.id===cfg.activeVoice)||(cfg.voices||DEFAULT_VOICES)[0] }
const Voice={
  voices:[], audio:null, works:null, fails:0, cur:[], talkingEl:null, unlocked:false,
  has(){ return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined' },
  load(){ try{ this.voices=speechSynthesis.getVoices()||[] }catch(e){ this.voices=[] } },
  pickFor(b){ const v=this.voices; if(!v.length) return null;
    if(b.voiceURI){ const f=v.find(x=>x.voiceURI===b.voiceURI); if(f) return f }
    const en=v.filter(x=>/^en/i.test(x.lang)); const list=en.length?en:v;
    const want=b.kind==='boy'?'m':'f';
    const score=x=>(voiceGender(x)===want?10:voiceGender(x)==='?'?4:0)+voiceQuality(x)+(/^en[-_]us/i.test(x.lang)?1:0);
    return list.slice().sort((a,b2)=>score(b2)-score(a))[0] },
  best(){ return this.pickFor({kind:'girl',voiceURI:''}) },
  clean(t){ return String(t==null?'':t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/…/g,',').replace(/\s+/g,' ').trim() },
  // one utterance per sentence: engines pause naturally and never trip over long text
  sentences(t){ const s=this.clean(t); if(!s) return []; const parts=s.match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g)||[s]; return parts.map(p=>p.trim()).filter(Boolean) },
  stop(){ Clips.stop(); Live.stop(); try{ if(this.has()) speechSynthesis.cancel() }catch(e){} if(this.audio){ this.audio.pause(); this.audio=null } this.mark(null); Music.duck(false) },
  mark(el){ if(this.talkingEl) this.talkingEl.classList.remove('talking'); this.talkingEl=el; if(el) el.classList.add('talking') },
  say(text,opts={}){ return this._say(text,opts) },
  async _say(text,opts){
    if(this.audio){ this.audio.pause(); this.audio=null }
    // 1. natural voice: Kokoro clips from the buddy's pack
    let b=opts.buddy||activeBuddy();
    if(opts.other){ const o=otherBuddy(b); if(o.pack&&Clips.status(o.pack)==='ready') b=o; else if(o.pack) Clips.ready(o.pack) }   // the other voice only when it is already loaded
    if(Clips.enabled()&&b.pack){
      Clips.stop();
      // wait a moment for a voice that is still downloading; after that this line uses the tablet voice and the download carries on
      const ok=await Promise.race([Clips.ready(b.pack),wait(Clips.status(b.pack)==='ready'?0:2500).then(()=>false)]);
      if(ok){ const segs=Clips.resolve(b.pack,text,{slow:(opts.rateMul||1)<.9}); 
        if(segs){ if(opts.el) this.mark(opts.el); Music.duck(true); this.works=true; hideVoiceNote();
          const played=await Clips.play(b.pack,segs,{rate:cfg.speed||1});
          if(this.talkingEl===opts.el) this.mark(null); Music.duck(false); if(played) return } }
    }
    // 2. live Kokoro: the same voice, generated on the tablet for lines that are not recorded
    const flat=Array.isArray(text)?text.map(x=>typeof x==='string'?x:'').join(' '):text;
    if(Live.enabled()&&b.pack&&Live.ids[b.pack]){ const t=this.clean(flat);
      if(t){ if(opts.el) this.mark(opts.el); Music.duck(true);
        const ok=await Live.speak(t,b.pack);

  tts(text,opts={}){
    const parts=this.sentences(text); if(!parts.length) return Promise.resolve();
    if(!this.has()){ this.fail(); return Promise.resolve() }
    const synth=window.speechSynthesis, wasBusy=synth.speaking||synth.pending;
    try{ synth.cancel() }catch(e){}

      let done=false, started=false; const fin=()=>{ if(done) return; done=true; if(this.talkingEl===opts.el) this.mark(null); Music.duck(false); res() };
      const speakNow=()=>{
        if(!this.voices.length) this.load();
        const v=this.pickFor(b), pitch=clamp((+b.pitch||1)*(opts.pitchMul||1),.5,1.6), rate=clamp((+b.rate||1)*(cfg.speed||1)*(opts.rateMul||1),.5,1.4);

        us[0].onstart=()=>{ started=true; this.works=true; this.fails=0; hideVoiceNote(); Music.duck(true) };
        us.forEach((u,i)=>{ u.onerror=e=>{ const err=e&&e.error; if(err!=='interrupted'&&err!=='canceled'&&!started) this.fail(); fin() }; if(i===us.length-1) u.onend=fin });
        if(opts.el) this.mark(opts.el);
        try{ synth.resume(); us.forEach(u=>synth.speak(u)) }catch(e){ this.fail(); fin(); return }
        setTimeout(()=>{ if(!started&&!done&&!synth.speaking){ this.fail(); fin() } },6000);
        setTimeout(fin,6000+parts.join(' ').length*120/rate);

      setTimeout(speakNow,wasBusy?120:0);   // Chrome drops speech queued in the same tick as cancel()
    }) },
  fail(){ if(this.works) return; this.fails++; if(this.fails>=2) showVoiceNote() },
  async play(audioId,fallbackText,opts={}){
    const d=audioId?await Store.getMedia(audioId):null;
    if(!d) return this.say(fallbackText,opts);
    this.stop(); if(opts.el) this.mark(opts.el); Music.duck(true);
    return new Promise(res=>{ const a=new Audio(d); this.audio=a; const end=()=>{ this.mark(null); Music.duck(false); res() }; a.onended=end; a.onerror=()=>{ this.say(fallbackText,opts).then(res) }; a.play().catch(()=>this.say(fallbackText,opts).then(res)) }) }
};

  pause(){ const w=this.want; this.stop(.2); this.want=w },

/* ================= storage: this tablet (IndexedDB) + your Claude account when available ================= */
const IDB={p:null,
  open(){ return this.p||(this.p=new Promise(res=>{ try{ const r=indexedDB.open('echobridge',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null) }catch(e){ res(null) } })) },
  async get(k){ const d=await this.open(); if(!d) return null; return new Promise(res=>{ try{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result??null); q.onerror=()=>res(null) }catch(e){ res(null) } }) },
  async set(k,v){ const d=await this.open(); if(!d) return; return new Promise(res=>{ try{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res }catch(e){ res() } }) },
  async del(k){ const d=await this.open(); if(!d) return; return new Promise(res=>{ try{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res; t.onerror=res }catch(e){ res() } }) }
};
let cfg=null;
const Store={cloud:null,media:new Map(),saveT:0,
  async load(){ const local=await IDB.get('config'); cfg=normalize(local); this.connect() },
  async connect(){
    try{
      if(!window.claude||typeof window.claude.use!=='function') return;
      const db=await window.claude.use('db'); if(!db) return;
      this.cloud=db;
      const snap=await db.doc('echobridge/config').get();
      const remote=snap.exists?snap.data():null;
      if(remote&&(remote.updatedAt||0)>(cfg.updatedAt||0)){ cfg=normalize(remote); await IDB.set('config',clone(cfg)); onDataChanged() }
      else if(!remote||(cfg.updatedAt||0)>(remote.updatedAt||0)){ await db.doc('echobridge/config').set(clone(cfg)) }
      hydrate(document);
    }catch(e){ console.warn('cloud unavailable',e) }
  },
  async save(){
    cfg.updatedAt=Date.now(); const snap=clone(cfg);
    await IDB.set('config',snap);
    if(this.cloud){ try{ await this.cloud.doc('echobridge/config').set(snap) }catch(e){ toast('Saved on this tablet. Syncing will try again next time.') } }
  },
  later(){ clearTimeout(this.saveT); this.saveT=setTimeout(()=>this.save(),800) },
  async putMedia(data,kind){
    const id=uid('m'); this.media.set(id,data); await IDB.set('media:'+id,data);
    if(this.cloud){ try{ await this.cloud.doc('media/'+id).set({kind,data}) }catch(e){ console.warn(e) } }
    return id },
  async getMedia(id){
    if(!id) return null; if(this.media.has(id)) return this.media.get(id);
    let d=await IDB.get('media:'+id);
    if(!d&&this.cloud){ try{ const s=await this.cloud.doc('media/'+id).get(); d=s.exists?(s.data()||{}).data:null; if(d) IDB.set('media:'+id,d) }catch(e){} }
    if(d) this.media.set(id,d); return d },
  async delMedia(id){ if(!id) return; this.media.delete(id); await IDB.del('media:'+id); if(this.cloud){ try{ await this.cloud.doc('media/'+id).delete() }catch(e){} } }
};

const stage=$('#stage'); let busy=false, cleanup=null, homeScroll=0;
const RING=['#FF8C87','#FFAE80','#FFD97B','#FFF47E','#A6E37B','#6EDFD7','#7FCBFA','#C49BEE','#FF9CC9'];
function runCleanup(){ if(cleanup){ try{ cleanup() }catch(e){} cleanup=null } }
function afterShow(view){ if(voiceNotePending&&view.classList.contains('home')) setTimeout(showVoiceNote,500) }
function show(view){ runCleanup(); stage.innerHTML=''; stage.append(view); hydrate(view); view.classList.contains('home')||view.classList.contains('levels')?Music.start():Music.stop(); afterShow(view) }
// Full iris for home ↔ feature; a quicker iris (opts.quick) between levels so play never drags
async function go(build,fromEl,opts={}){
  if(busy) return; busy=true; stage.style.pointerEvents='none';
  Voice.stop(); runCleanup(); hideVoiceNote();
  const old=stage.lastElementChild; let view;
  try{ view=build() }catch(e){ console.error(e); busy=false; stage.style.pointerEvents=''; return }
  const isMenu=view.classList.contains('home')||view.classList.contains('levels');
  let iris=null;
  try{
    if(!old||reduceMotion()){
      view.style.opacity=0; stage.append(view); hydrate(view); isMenu?Music.start():Music.stop();
      await view.animate([{opacity:0},{opacity:1}],{duration:220,fill:'forwards'}).finished.catch(()=>{});
      view.style.opacity=''; [...stage.children].forEach(c=>c!==view&&c.remove()); return }
    const T=opts.quick?{close:360,glide:0,pause:40,open:360}:{close:700,glide:340,pause:140,open:680};
    SFX.whoosh(); isMenu?Music.start():Music.stop(.9);
    const W=innerWidth,H=innerHeight,cx=W/2,cy=H/2;
    let px=cx,py=cy; if(fromEl&&fromEl.isConnected){ const r=fromEl.getBoundingClientRect(); px=r.left+r.width/2; py=r.top+r.height/2 }
    const far=(x,y)=>Math.max(Math.hypot(x,y),Math.hypot(W-x,y),Math.hypot(x,H-y),Math.hypot(W-x,H-y));
    const R=Math.max(far(px,py),far(cx,cy))*1.05, step=R/(RING.length-.6);
    iris=h('div',{class:'iris'}); const wrap=h('div',{class:'ringWrap'}); iris.append(wrap);
    for(let i=RING.length-1;i>=0;i--){ const r=(i+1)*step; wrap.append(h('div',{class:'ring',style:`width:${2*r}px;height:${2*r}px;left:${-r}px;top:${-r}px;background:${RING[i]}`})) }
    wrap.style.transform=`translate(${px}px,${py}px)`;
    document.body.append(iris);
    old.style.willChange='clip-path';
    const r0=far(px,py)*1.02;
    wrap.animate([{transform:`translate(${px}px,${py}px) scale(1.18)`},{transform:`translate(${px}px,${py}px) scale(1)`}],{duration:T.close,easing:'ease-out'});
    await old.animate([{clipPath:`circle(${r0}px at ${px}px ${py}px)`},{clipPath:`circle(0px at ${px}px ${py}px)`}],{duration:T.close,easing:'cubic-bezier(.55,0,.75,.35)',fill:'forwards'}).finished.catch(()=>{});
    [...stage.children].forEach(c=>c.remove());
    const ox=T.glide?cx:px, oy=T.glide?cy:py;
    if(T.glide&&Math.hypot(px-cx,py-cy)>4){ await wrap.animate([{transform:`translate(${px}px,${py}px)`},{transform:`translate(${cx}px,${cy}px)`}],{duration:T.glide,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished.catch(()=>{}) }
    await wait(T.pause);
    const R2=far(ox,oy)*1.02; view.style.willChange='clip-path'; stage.append(view); hydrate(view);
    const a=view.animate([{clipPath:`circle(0px at ${ox}px ${oy}px)`},{clipPath:`circle(${R2}px at ${ox}px ${oy}px)`}],{duration:T.open,easing:'cubic-bezier(.3,0,.2,1)',fill:'forwards'});
    await a.finished.catch(()=>{}); a.cancel(); view.style.willChange='';
  } finally { if(iris) iris.remove(); if(!view.isConnected){ stage.innerHTML=''; stage.append(view); hydrate(view) } busy=false; stage.style.pointerEvents=''; afterShow(view) }
}

function listenRounds(li){

    stop(){ if(!this.nodes) return; const {c,master,osc}=this.nodes; master.gain.cancelScheduledValues(c.currentTime); master.gain.setValueAtTime(master.gain.value,c.currentTime); master.gain.linearRampToValueAtTime(.0001,c.currentTime+.8); setTimeout(()=>osc.forEach(o=>{ try{o.stop()}catch(e){} }),900); this.nodes=null } };

  const keys=h('div',{class:'keys'});
  const s=modal(h('div',{class:'sheet pin'},h('h2',null,'Grown-up corner'),h('p',{class:'muted',style:'margin:0'},'Enter your 4-digit PIN.'+(cfg.pin==='1234'?' The starting PIN is 1234. Change it in Lock & data.':'')),dots,keys,
    h('div',{style:'margin-top:14px'},h('button',{class:'btn',onclick:()=>s.remove()},'Cancel'))));
  [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(k=>keys.append(k===''?h('span'):h('button',{onclick:()=>{

function photoField(label,value,onChange){
  let cur=value; const prev=h('div',{class:'prev'}); const file=h('input',{type:'file',accept:'image/*',hidden:true});
  const rm=h('button',{type:'button',class:'btn warn'},'Remove photo');
  const draw=()=>{ prev.innerHTML=''; if(cur){ prev.append(mediaImg(cur)); hydrate(prev) } else prev.textContent='No photo'; rm.hidden=!cur }; draw();
  file.addEventListener('change',async()=>{ const f=file.files[0]; if(!f) return; try{ const url=await blobToDataURL(f); const img=await loadImg(url); const m=560, s=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cur=await Store.putMedia(c.toDataURL('image/jpeg',.8),'photo'); onChange(cur); draw() }catch(e){ toast('That photo could not be opened. Try a JPG or PNG.') } file.value='' });
  rm.addEventListener('click',()=>{ cur=null; onChange(null); draw() });
  return h('div',{class:'field'},h('span',null,label),h('div',{class:'media'},prev,h('button',{type:'button',class:'btn',onclick:()=>file.click()},'Add or take photo'),rm,file)) }
function voiceField(label,value,onChange,sampleText,emptyHint){
  let cur=value, rec=null, stopT=0; const status=h('span',{class:'muted'});
  const recBtn=h('button',{type:'button',class:'btn rec'},'● Record'), play=h('button',{type:'button',class:'btn'},'▶ Play'), rm=h('button',{type:'button',class:'btn warn'},'Remove');
  const file=h('input',{type:'file',accept:'audio/*',hidden:true}), up=h('button',{type:'button',class:'btn',onclick:()=>file.click()},'Upload a recording');
  const draw=()=>{ play.disabled=!cur; rm.hidden=!cur; status.textContent=rec?'Recording… tap Stop when done (8 seconds max).':cur?'Your recording plays instead of the app voice.':(emptyHint||(sampleText?'No recording yet. The voice buddy will say it.':'')) }; draw();
  async function keep(blob){ const url=await blobToDataURL(blob); if(url.length>240000){ toast('That recording is too long. Keep it under about 8 seconds.'); return } cur=await Store.putMedia(url,'audio'); onChange(cur); draw() }
  recBtn.addEventListener('click',async()=>{
    if(rec){ clearTimeout(stopT); rec.stop(); return }
    try{ const stream=await navigator.mediaDevices.getUserMedia({audio:true}); const mr=new MediaRecorder(stream); const chunks=[];
      mr.ondataavailable=e=>chunks.push(e.data); mr.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); rec=null; recBtn.textContent='● Record'; await keep(new Blob(chunks,{type:mr.mimeType||'audio/webm'})); draw() };
      mr.start(); rec=mr; recBtn.textContent='■ Stop'; draw(); stopT=setTimeout(()=>{ if(rec) rec.stop() },8000) }
    catch(e){ status.textContent='The microphone isn’t available here. Record on your phone and use “Upload a recording” instead.' } });
  file.addEventListener('change',async()=>{ const f=file.files[0]; if(f) await keep(f); file.value='' });
  play.addEventListener('click',()=>Voice.play(cur,sampleText));
  rm.addEventListener('click',()=>{ cur=null; onChange(null); draw() });
  return h('div',{class:'field'},h('span',null,label),h('div',{class:'row'},recBtn,play,up,rm,file),status) }

    const spd=h('input',{type:'range',min:'0.85',max:'1.15',step:'0.05',value:String(cfg.speed||1)}); const spdOut=h('b',null,speedLabel(cfg.speed||1));

        card.append(h('label',{class:'sl'},h('span',null,'Kokoro voice'),pk),h('p',{class:'muted',style:'margin:6px 0 0'},st==='ready'?'✅ Ready on this tablet':st==='failed'?(Clips.problem(b.pack)==='damaged'?`⚠️ The voice file ${b.pack}.ebv is damaged. Upload a fresh copy next to the app.`:Clips.problem(b.pack)==='missing'?`⚠️ The voice file ${b.pack}.ebv was not found. Upload it next to the app.`:`⚠️ Could not download ${b.pack}.ebv. Check the internet and reload.`):st==='loading'?'⏳ Downloading…':'Downloads once, then works offline'));

        const slider=(lab,key,min,max,stp)=>{ const out=h('b',null,(+b[key]).toFixed(2)); const r=h('input',{type:'range',min,max,step:stp,value:String(b[key])}); r.addEventListener('input',()=>{ b[key]=+r.value; out.textContent=(+r.value).toFixed(2); Store.later() }); r.addEventListener('change',()=>Voice.tts('Hi! I want to eat apples.',{buddy:b})); return h('label',{class:'sl'},h('span',null,lab,out),r) };

        h('button',{class:'btn',onclick:e=>{ const txt=DEFAULT_VOICES.some(d=>d.name===b.name)?`Hi! I’m ${b.name}. I want to eat apples. Can we play outside?`:'Hi! I want to eat apples. Can we play outside?'; Voice.say(txt,{buddy:b,el:e.currentTarget}) }},'▶ Test'),

      h('div',{class:'acts'},h('button',{class:'btn',onclick:()=>editScen(s)},'Edit'),h('button',{class:'btn warn',onclick:()=>confirmBox(`Delete “${s.title}”?`,'Delete',async()=>{ cfg.scenarios=cfg.scenarios.filter(x=>x!==s); await save('Story deleted'); drawPanel() })},'Delete')))));
    panel.append(list) }
  function blankStep(){ return {text:'',emojis:'',fx:null,photo:null,question:'What happens next?',options:[{text:'',emoji:'',correct:true,why:''},{text:'',emoji:'',correct:false,why:''},{text:'',emoji:'',correct:false,why:''}]} }
  function editScen(s){ const d=s?clone(s):{id:uid('sc'),title:'',emoji:'⭐',color:'#FFE7B8',photo:null,steps:[blankStep()]};
    const stepsBox=h('div');
    const drawSteps=()=>{ stepsBox.innerHTML=''; d.steps.forEach((st,k)=>{
      const box=h('div',{class:'stepBox'},h('h3',null,`Step ${k+1}`));
      box.append(textField('What is happening (short sentence)',st.text,x=>st.text=x,{placeholder:'The barber turns on the clippers. Buzz!'}),
        photoField('Real photo of this moment (optional)',st.photo,x=>st.photo=x),
        textField('Or up to 3 emoji for a cartoon scene',st.emojis,x=>st.emojis=x,{placeholder:'💈🪑'}),
        textField('Question to ask',st.question,x=>st.question=x));
      const og=h('div',{class:'optGrid'}); const name='c'+k+uid('r');
      st.options.forEach((o,j)=>{ const r=h('input',{type:'radio',name,'aria-label':'This is the helpful choice'}); r.checked=!!o.correct; r.addEventListener('change',()=>st.options.forEach((x,q)=>x.correct=q===j));
        const e=h('input',{type:'text',value:o.emoji||'',placeholder:'🙂','aria-label':'Emoji',style:'font-size:24px;text-align:center'}); e.addEventListener('input',()=>o.emoji=e.value);
        const t=h('input',{type:'text',value:o.text||'',placeholder:j===0?'Helpful choice':'Other choice','aria-label':'Choice'}); t.addEventListener('input',()=>o.text=t.value);
        const w=h('input',{type:'text',class:'whyIn',value:o.why||'',placeholder:j===0?'Why it works: Yes! Sitting still helps the barber…':'Gentle reason: That could…','aria-label':'Why'}); w.addEventListener('input',()=>o.why=w.value);
        og.append(h('div',{class:'optEd'},r,e,t,h('span'),w)) });
      box.append(h('div',{class:'field'},h('span',null,'Three choices (mark the helpful one with the circle)'),og));
      if(d.steps.length>1) box.append(h('button',{type:'button',class:'btn warn',onclick:()=>{ d.steps.splice(k,1); drawSteps() }},'Remove this step'));
      stepsBox.append(box) });
      if(d.steps.length<5) stepsBox.append(h('button',{type:'button',class:'btn',onclick:()=>{ d.steps.push(blankStep()); drawSteps() }},'+ Add another step')) };
    drawSteps();
    editorSheet(s?'Edit story':'New story',[textField('Title',d.title,x=>d.title=x,{placeholder:'Haircut'}),emojiField(d.emoji,x=>d.emoji=x),photoField('Level photo (optional)',d.photo,x=>d.photo=x),stepsBox],
      async()=>{ if(!d.title.trim()){ toast('Give the story a title.'); return false }
        const ok=d.steps.every(st=>st.text.trim()&&st.options.filter(o=>o.text.trim()).length>=2&&st.options.some(o=>o.correct&&o.text.trim()));
        if(!ok){ toast('Each step needs a sentence and at least two choices, with the helpful one marked.'); return false }
        if(s) Object.assign(s,d); else cfg.scenarios.push(d); await save(s?'Story updated':'Story added'); drawPanel() },'Save story') }

  function prog(){
    panel.append(h('h2',null,'Progress'),h('p',{class:'muted'},'Stars show how smoothly each level went: 3 stars means no wrong tries. Levels can be replayed any time.'));
    const t=h('table',{class:'progTable'});
    FEATS.filter(F=>F.levels).forEach(F=>{ const n=F.levels().length, p=cfg.progress[F.id]||{}; const played=Object.keys(p).length, stars=Object.values(p).reduce((a,b)=>a+b,0);
      t.append(h('tr',null,h('td',null,F.title),h('td',null,`${played} of ${n} levels`),h('td',null,`⭐ ${stars} / ${n*3}`))) });
    panel.append(t,h('div',{class:'row',style:'margin-top:16px'},h('button',{class:'btn warn',onclick:()=>confirmBox('Clear all stars?','Clear',async()=>{ cfg.progress={}; await save('Stars cleared'); drawPanel() })},'Clear all stars'))) }

  function lock(){
    let p1='',p2='';
    panel.append(h('h2',null,'Lock & data'),h('p',{class:'muted'},'The PIN keeps little fingers out of the grown-up corner. It isn’t a password, so don’t reuse an important one.'));
    const a=h('input',{type:'password',inputmode:'numeric',maxlength:'4',placeholder:'New PIN'}), b=h('input',{type:'password',inputmode:'numeric',maxlength:'4',placeholder:'Repeat PIN'});
    a.addEventListener('input',()=>p1=a.value); b.addEventListener('input',()=>p2=b.value);
    panel.append(h('div',{class:'field'},h('span',null,'Change PIN'),h('div',{class:'row'},a,b,h('button',{class:'btn primary',onclick:async()=>{ if(!/^\d{4}$/.test(p1)){ toast('Use exactly 4 numbers.'); return } if(p1!==p2){ toast('The two PINs don’t match.'); return } cfg.pin=p1; a.value=b.value=''; await save('PIN changed') }},'Change PIN'))));
    panel.append(h('h3',null,'Where things are saved'),h('p',{class:'muted'},'Everything is saved on this tablet, in this browser. Clearing the browser’s data would erase it, so keep the PIN and your custom buttons noted somewhere.'),
      h('p',{class:'muted'},'Photos and voice recordings stay on this device and are never uploaded.'));
    panel.append(h('h3',null,'Start over'),h('p',{class:'muted'},'Bring back the starting buttons, phrases and stories. Your PIN, child’s name, voices and stars stay.'),
      h('button',{class:'btn warn',onclick:()=>confirmBox('Restore the starting content?','Restore',async()=>{ const d=defaults(); cfg.needs=d.needs; cfg.scripts=d.scripts; cfg.scenarios=d.scenarios; await save('Starting content restored'); drawPanel() })},'Restore starting content')) }

  drawTabs(); drawPanel();
  return v }

/* ================= boot ================= */
function onDataChanged(){ const cur=stage.lastElementChild; if(cur&&cur.classList.contains('home')&&!busy) show(viewHome()) }
(async()=>{ await Store.load(); show(viewHome()); const b=activeBuddy(); if(b.pack&&Clips.enabled()){ loadPill(b) } })();
if('serviceWorker' in navigator&&location.protocol==='https:'){ addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{})) }
</script>
